server.port=3002

# 数据库凭据优先读环境变量（KOB_DB_USER / KOB_DB_PASSWORD），开发环境可用默认值
spring.datasource.username=${KOB_DB_USER:root}
spring.datasource.password=${KOB_DB_PASSWORD:123456}
spring.datasource.url=jdbc:mysql://${KOB_DB_HOST:localhost}:${KOB_DB_PORT:3306}/kob?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
